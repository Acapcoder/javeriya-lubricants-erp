# Production deployment for the office server (IMPLEMENTATION.md §3).
# Everything stays on the local network; nothing is exposed publicly.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orcms}
      POSTGRES_USER: ${POSTGRES_USER:-orcms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-orcms}']
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host: only the app container reaches the database.
    expose:
      - '5432'

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-orcms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-orcms}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TOTP_ISSUER: ${TOTP_ISSUER:-ORCMS}
    volumes:
      - attachments:/app/storage/attachments
    ports:
      - '3000:3000'

  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - attachments:/attachments:ro
    # Nightly dated dump at 01:00 (§13). Retention is handled by the host
    # backup job that copies /backups off the machine.
    entrypoint: >
      sh -c 'while true; do
        target=$$(date +%s);
        sleep $$(( 86400 - (target % 86400) + 3600 ));
        pg_dump -h db -U ${POSTGRES_USER:-orcms} -Fc ${POSTGRES_DB:-orcms}
          > /backups/orcms-$$(date +%Y%m%d-%H%M%S).dump;
      done'

volumes:
  pgdata:
  attachments:
